name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The floors legs keep the name they have always had
    # ("ubuntu-latest / Python 3.12"), because branch protection and
    # anything else that refers to a check refers to it by that string.
    # Only the locked legs carry a suffix, so the two kinds can be told
    # apart in the checks list without renaming the existing ones.
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.deps == 'lock' && ' / locked deps' || '' }}"
    runs-on: ${{ matrix.os }}

    # A crash during interpreter finalisation reports as a bare exit code
    # 139 with a green test summary printed directly above it -- no
    # failing test, no traceback, nothing to act on. This makes Python
    # dump the faulting stack instead, which is the difference between a
    # diagnosable defect and a flake people re-run until it passes.
    env:
      PYTHONFAULTHANDLER: "1"

    # Development happens on Windows; every deployment happens on Linux.
    # Only Linux was ever in this matrix, so "OS-agnostic" was a claim the
    # code made about itself that CI did not actually check. Running both
    # here is what turns that claim into something verified rather than
    # asserted. macOS joined for the same reason: it was the last major OS
    # this matrix left unverified.
    #
    # bash as the run-step shell on every OS (rather than the pwsh default
    # Windows runners otherwise use) keeps every step below a single
    # script that behaves the same on both, instead of a second dialect
    # for one leg of the matrix.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Two questions, so two installs of the same suite.
        #
        # floors  = requirements.txt (lower bounds only), so whatever the
        #           newest releases are today. This is the early warning:
        #           it fails when an upstream release breaks us, before any
        #           deployment is asked to take that release.
        # lock    = requirements.lock (exact pins), the tree a deployment
        #           actually installs (see docs/deployment-runbook.md).
        #           Floors alone meant CI never ran what was deployed:
        #           sqlglot is pinned at 30.18.0 because
        #           security/sql_guard.py makes every allow/deny decision
        #           from its AST, yet CI was running whatever newer
        #           sqlglot had been released.
        #
        # The lock was generated on CPython 3.13, but every pin in it has a
        # wheel for CPython 3.11, 3.12 and 3.13 on Linux (x86_64), Windows
        # (x86_64) and macOS (arm64, as macos-latest is), so the lock runs
        # across the full OS x Python grid rather than only on the one
        # interpreter it was generated on. If a future lock regeneration
        # drops a combination, exclude it here rather than letting that leg
        # fail on a missing wheel.
        deps: [floors, lock]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The pip cache is keyed on a hash of the files named here. The
          # default (**/requirements.txt) never looks at requirements.lock,
          # so a locked leg would share its key with the floors leg of the
          # same OS and Python and keep an out-of-date cache when the lock
          # changes. Naming the lock for the locked legs gives each kind of
          # leg its own cache.
          cache-dependency-path: ${{ matrix.deps == 'lock' && '**/requirements.lock' || '**/requirements.txt' }}

      # pyodbc ships binary wheels for macOS, so pip install succeeds without
      # this, but the wheel isn't self-contained: it dynamically links
      # against unixODBC's driver manager (libodbc.dylib), which is not
      # bundled and is absent from GitHub's macOS runners by default.
      # Without it, importing pyodbc fails at test-collection time with
      # "Library not loaded" rather than at install time -- so this has to
      # run before dependencies are installed, not in response to a pip
      # failure. Linux and Windows wheels don't have this gap (manylinux
      # wheels bundle unixODBC; the Windows driver manager ships with the OS).
      - name: Install unixODBC driver manager (macOS)
        if: runner.os == 'macOS'
        run: brew install unixodbc

      - name: Install dependencies
        env:
          # Locked legs pass the lock to the two installs below as a
          # constraint as well. webapp/requirements.txt and pytest are not
          # in the lock, and without a constraint either could move a
          # pinned package (for instance by requiring a newer markupsafe),
          # which would leave the leg testing something other than the lock
          # while still being named after it. With the constraint pip
          # either keeps every pin or fails loudly on the conflict. Left
          # empty for the floors legs, which are meant to float.
          CONSTRAINT: ${{ matrix.deps == 'lock' && '-c requirements.lock' || '' }}
        run: |
          pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "lock" ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          # webapp/ is a second Flask app with its own deps; its security
          # tests (test_flask_hardening, test_webapp_http_surface, the webapp
          # file-permission cases) import webapp.app, so CI must install its
          # requirements or those tests ModuleNotFoundError on a clean runner.
          pip install $CONSTRAINT -r webapp/requirements.txt
          pip install $CONSTRAINT pytest pytest-cov

      # Findings 5 + 9 (2026 audit): requirements.lock (above) stops a
      # dependency changing without this repo's consent; this step is the
      # other half -- it tells us when something already pinned turns out
      # to be vulnerable. Audits requirements.lock rather than
      # requirements.txt because the lock is the exact, pinned tree this
      # deployment actually runs -- auditing floor versions would miss
      # whatever a real install resolved to. A finding here fails the
      # build deliberately: "known-vulnerable dependency, undetected" is
      # exactly the gap this step exists to close, so it is not allowed
      # to pass silently. The lockfile is one tree shared by every leg of
      # the matrix, not a per-OS resolution, so auditing it once (Linux,
      # the deployment target) says exactly as much as auditing it
      # eighteen times would. That includes the locked legs: they install
      # the same file, so they do not repeat the audit either; it runs on
      # the one floors leg below.
      - name: Dependency vulnerability audit (pip-audit)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.deps == 'floors'
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Run tests
        env:
          # project_config/ is git-ignored (it holds this deployment's real
          # domain data and warehouse schema) and is therefore absent on a
          # fresh checkout, including CI's. Point the knowledge/schema
          # loaders at the committed, sample-data template instead — see
          # config.Settings.project_config_dir. There is deliberately no
          # automatic fallback to this directory in the code itself; CI
          # opts in explicitly the same way any other deployment would.
          PROJECT_CONFIG_DIR: project_config.example
        run: pytest tests/ eval/tests -v

      # Doctests were never executed by CI, so the docstrings drifted from
      # the code unnoticed: sql_guard carried a doctest that asserted the
      # wrong CTE output, and two more (api/health, database/relationship_map)
      # marked an assignment +SKIP while leaving the lines that used the
      # variable live, so they raised NameError the moment they ran.
      # Docstrings in this codebase are treated as contract, so run them.
      # appdb/migrations is Alembic's own scripts directory. env.py is only
      # valid when Alembic runs it -- it reads context.config, which Alembic
      # injects -- so importing it for doctest collection raises. Excluded
      # rather than guarded: it is a migration runner, not a module anyone
      # imports, and there are no docstrings in it to check.
      - name: Run doctests
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: >-
          pytest --doctest-modules -q
          api llm security session database core knowledge prompt_engine
          retrieval schema_data logs exporters observability eval config.py

      # Coverage is measured and uploaded from one leg only, the floors leg
      # that has always done it. A second upload from the locked leg of the
      # same commit would be a competing report for the same lines, and the
      # locked legs exist to answer "does the pinned tree pass", not to
      # produce a number.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.deps == 'floors'
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: pytest tests/ eval/tests --cov --cov-report=term-missing --cov-report=xml

      # Offline evaluation gate. Proves the harness, the guard and the
      # fingerprinting still work end to end; it is NOT an accuracy
      # measurement, because offline mode replays the golden set's own
      # expected_sql (see eval/runner.py). Accuracy needs --live.
      - name: Evaluation harness smoke run
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: python -m eval.cli run --golden eval_data.example/golden.jsonl

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && matrix.deps == 'floors'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
