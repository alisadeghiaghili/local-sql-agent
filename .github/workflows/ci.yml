name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}

    # A crash during interpreter finalisation reports as a bare exit code
    # 139 with a green test summary printed directly above it -- no
    # failing test, no traceback, nothing to act on. This makes Python
    # dump the faulting stack instead, which is the difference between a
    # diagnosable defect and a flake people re-run until it passes.
    env:
      PYTHONFAULTHANDLER: "1"

    # Development happens on Windows; every deployment happens on Linux.
    # Only Linux was ever in this matrix, so "OS-agnostic" was a claim the
    # code made about itself that CI did not actually check. Running both
    # here is what turns that claim into something verified rather than
    # asserted.
    #
    # bash as the run-step shell on every OS (rather than the pwsh default
    # Windows runners otherwise use) keeps every step below a single
    # script that behaves the same on both, instead of a second dialect
    # for one leg of the matrix.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # webapp/ is a second Flask app with its own deps; its security
          # tests (test_flask_hardening, test_webapp_http_surface, the webapp
          # file-permission cases) import webapp.app, so CI must install its
          # requirements or those tests ModuleNotFoundError on a clean runner.
          pip install -r webapp/requirements.txt
          pip install pytest pytest-cov

      # Findings 5 + 9 (2026 audit): requirements.lock (above) stops a
      # dependency changing without this repo's consent; this step is the
      # other half -- it tells us when something already pinned turns out
      # to be vulnerable. Audits requirements.lock rather than
      # requirements.txt because the lock is the exact, pinned tree this
      # deployment actually runs -- auditing floor versions would miss
      # whatever a real install resolved to. A finding here fails the
      # build deliberately: "known-vulnerable dependency, undetected" is
      # exactly the gap this step exists to close, so it is not allowed
      # to pass silently. The lockfile is one tree shared by every leg of
      # the matrix, not a per-OS resolution, so auditing it once (Linux,
      # the deployment target) says exactly as much as auditing it six
      # times would.
      - name: Dependency vulnerability audit (pip-audit)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Run tests
        env:
          # project_config/ is git-ignored (it holds this deployment's real
          # domain data and warehouse schema) and is therefore absent on a
          # fresh checkout, including CI's. Point the knowledge/schema
          # loaders at the committed, sample-data template instead — see
          # config.Settings.project_config_dir. There is deliberately no
          # automatic fallback to this directory in the code itself; CI
          # opts in explicitly the same way any other deployment would.
          PROJECT_CONFIG_DIR: project_config.example
        run: pytest tests/ eval/tests -v

      # Doctests were never executed by CI, so the docstrings drifted from
      # the code unnoticed: sql_guard carried a doctest that asserted the
      # wrong CTE output, and two more (api/health, database/relationship_map)
      # marked an assignment +SKIP while leaving the lines that used the
      # variable live, so they raised NameError the moment they ran.
      # Docstrings in this codebase are treated as contract, so run them.
      # appdb/migrations is Alembic's own scripts directory. env.py is only
      # valid when Alembic runs it -- it reads context.config, which Alembic
      # injects -- so importing it for doctest collection raises. Excluded
      # rather than guarded: it is a migration runner, not a module anyone
      # imports, and there are no docstrings in it to check.
      - name: Run doctests
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: >-
          pytest --doctest-modules -q
          api llm security session database core knowledge prompt_engine
          retrieval schema_data logs exporters observability eval config.py

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: pytest tests/ eval/tests --cov --cov-report=term-missing --cov-report=xml

      # Offline evaluation gate. Proves the harness, the guard and the
      # fingerprinting still work end to end; it is NOT an accuracy
      # measurement, because offline mode replays the golden set's own
      # expected_sql (see eval/runner.py). Accuracy needs --live.
      - name: Evaluation harness smoke run
        env:
          PROJECT_CONFIG_DIR: project_config.example
        run: python -m eval.cli run --golden eval_data.example/golden.jsonl

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
