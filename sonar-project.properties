#
# SonarQube analysis settings, read by the `sonar` job in
# .github/workflows/ci.yml (SonarSource/sonarqube-scan-action).
#
# The quality gate itself is configured on the Sonar side, not here. What
# this file controls is which files the gate is measured against, and it
# has to agree with the rest of the repository's tooling, or the gate
# measures something other than what CI already enforces:
#
#   * main code vs test code    -> same split as pytest's testpaths
#   * coverage scope            -> same omit list as setup.cfg [coverage:run]
#   * Python versions           -> same matrix as the `test` job
#
# A change to any of those three places needs the matching change here.

# -- Project identity --------------------------------------------------------
# SonarQube Cloud's defaults for a GitHub repository imported from this
# account. For a self-hosted SonarQube Server, delete sonar.organization
# (Server has no organizations) and set SONAR_HOST_URL as a repository
# variable (see ci.yml).
sonar.projectKey=alisadeghiaghili_local-sql-agent
sonar.organization=alisadeghiaghili
sonar.projectName=Auction NLQ Engine (local-sql-agent)
# sonar.projectVersion is passed by CI from core/version.py, so a "previous
# version" new-code definition moves exactly when a release does.

sonar.sourceEncoding=UTF-8

# -- What is main code and what is test code ---------------------------------
# A file may be indexed once only, so everything the tests property claims
# is excluded from the sources property. conftest.py at the root is pytest
# fixture code, not engine code.
sonar.sources=.
sonar.tests=tests,eval/tests,conftest.py
sonar.exclusions=\
  tests/**,\
  eval/tests/**,\
  conftest.py,\
  web/assets/vendor/**,\
  **/__pycache__/**,\
  .venv/**,\
  htmlcov/**,\
  demo.zip

# -- Python ------------------------------------------------------------------
# Every interpreter the `test` matrix runs. Without this the analyzer
# assumes every Python 3 version and reports some rules as version-
# ambiguous instead of applying them.
sonar.python.version=3.11,3.12,3.13

# Written by the "Run tests with coverage" step (pytest --cov-report=xml)
# and handed to the sonar job as an artifact.
sonar.python.coverage.reportPaths=coverage.xml

# -- Coverage scope ----------------------------------------------------------
# The same files setup.cfg [coverage:run] omits, for the same reasons (see
# the comments there: interactive wizards excluded by policy, two modules
# outside the tested scope until a later phase extracts them). coverage.py
# simply leaves them out of coverage.xml; Sonar does not read setup.cfg and
# would count every one of them as 0% covered instead -- about 14,600
# lines, enough to pull overall coverage from ~95% to ~61% and to fail the
# coverage condition on any change that touches them.
# web/** is JavaScript, which this suite does not measure.
sonar.coverage.exclusions=\
  scripts/**,\
  web/**,\
  site/**,\
  setup_project.py,\
  llm/wizard_llm.py,\
  database/schema_inspector_cli.py,\
  database/schema_inspector.py,\
  database/relationship_map.py
