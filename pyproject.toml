[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "sql-agent"
version     = "0.3.0"
description = "Fully local NLQ → SQL Server agent powered by Ollama + LangChain"
readme      = "README.md"
requires-python = ">=3.9"
license     = { text = "MIT" }

dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "pyodbc>=5.0.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sql-agent          = "runners.nlq:main"
sql-agent-langchain = "agents.langchain_sql:main"
sql-agent-sqlite   = "agents.nlq_with_sqlite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit   = ["tests/*"]
