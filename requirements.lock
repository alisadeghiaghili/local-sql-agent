# Auction NLQ Engine — pinned dependency lock (Findings 5 + 9, 2026 audit)
#
# requirements.txt states floors only (e.g. sqlalchemy>=2.0.0), which
# means two installs a month apart can resolve completely different
# dependency trees with no review and no signal — see
# tests/security_audit/test_supply_chain.py's module docstring for the
# full reasoning. This file pins every package requirements.txt pulls in,
# transitively, to the exact version this deployment was validated
# against. Install with:
#
#     pip install -r requirements.lock
#
# not `pip install -r requirements.txt` directly — see
# docs/deployment-runbook.md.
#
# sqlglot is pinned deliberately, not incidentally: security/sql_guard.py
# makes every one of its allow/deny decisions from that parser's AST, so a
# silent sqlglot upgrade is the one dependency change in this tree that can
# alter security behaviour without a single line of this repository
# changing.
#
# Provenance: generated via `pip freeze` against this project's current,
# already-installed development environment (Windows, CPython 3.13),
# filtered down to requirements.txt's own packages plus the transitive
# closure importlib.metadata reports for them — NOT a clean-room `pip
# install` into a fresh virtualenv followed by `pip-compile`/`pip freeze`
# there. That is a meaningfully weaker provenance guarantee than a clean
# resolve (this environment could already hold a locally-patched or
# otherwise nonstandard build of any package below) and should be
# re-generated from a clean venv — ideally on the target Linux deployment
# platform — before this lock is treated as authoritative for a
# production rollout. Two packages `uvicorn[standard]` can pull in on
# Linux, `uvloop` and (on Python < 3.11) `exceptiongroup`, are absent from
# this Windows/3.13 environment and therefore absent below; uvicorn works
# without `uvloop` (it falls back to asyncio's own event loop), so this is
# a performance gap on Linux, not a missing hard dependency — add it back
# explicitly if/when this lock is regenerated on the real deployment
# platform.
