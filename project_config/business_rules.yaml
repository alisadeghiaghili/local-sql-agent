# Auction domain business rules
# Each key is a rule category name.
# rule_text: free-form instructions for the LLM about how to query this concept.

rules:
  purchase:
    rule_text: |
      Customer purchases must use Auction_Fact.CustomerContract.
      Purchase value = SUM(CustomerContract.TotalPrice)
      Purchase volume = SUM(CustomerContract.Quantity)
      Customer ranking must be based on CustomerContract.
  trade:
    rule_text: |
      در این دیتابیس، تمام "معاملات" و "خرید" و "فروش" مشتریان
      در جدول Auction_Fact.CustomerContract ذخیره می‌شود.
      جدول Auction_Fact.Contract فقط برای تطابق تالاری (Hall Matching) استفاده می‌شود
      و ربطی به معاملات نهایی مشتریان ندارد.

      Trade value = SUM(CustomerContract.TotalPrice)
      Trade volume = SUM(CustomerContract.Quantity)
      Trade count = COUNT(DISTINCT CustomerContract.ID)
      Average trade price = AVG(CustomerContract.Price)

      Contract table (Auction_Fact.Contract) is ONLY for Hall Matching analysis.
      When user asks about trades/transactions/معاملات use CustomerContract NOT Contract.
  offer:
    rule_text: |
      Offer analysis must use Auction_Fact.Offer.
      Offer quantity = SUM(Offer.OfferQuantity)
      Offer value = SUM(Offer.HallContractTotalPrice)
      Offer count = COUNT(DISTINCT Offer.ID)
  order:
    rule_text: |
      Order analysis must use Auction_Fact.Order.
      Order volume = SUM(Order.BuyOrder_Lot)
      Order count = COUNT(DISTINCT Order.ID)
  customer:
    rule_text: |
      مشتری = Customer
      خریدار = Customer
      Customer ranking must use CustomerContract.
  supplier:
    rule_text: |
      عرضه کننده = Supplier
      فروشنده = Supplier
      تامین کننده = Supplier
  broker:
    rule_text: |
      کارگزار = Broker
      Buyer broker means BuyerBroker_ID.
      Seller broker means SellerBroker_ID.
      Broker performance must be calculated using BuyerBroker_ID or SellerBroker_ID.
      Never use generic Broker_ID when question explicitly mentions buyer or seller broker.
      Broker display name column is PersianName, NOT Name.
      Correct: b.PersianName
      Incorrect: b.Name
  symbol:
    rule_text: |
      نماد = Symbol
      کالا = Symbol
      محصول = Symbol
      Trading symbol = TradingSymbol
  date:
    rule_text: |
      All date filtering must use General_Dim.Date (alias gd).
      Join facts to the Date table via Date_ID: JOIN [General_Dim].[Date] gd ON cc.Date_ID = gd.ID
      (CustomerContract also has HallDate_ID / FinalPaymentDate_ID etc. — use Date_ID unless the question names another date.)

      PREFERRED — filter dates with the PersianDate string column (zero-padded 'YYYY/MM/DD', e.g. '1405/01/01'):
      - Year (سال):        gd.PersianDate LIKE '1405/%'
      - Year + month:      gd.PersianDate LIKE '1405/05/%'   (month zero-padded, e.g. 05 for مرداد)
      - Exact day:         gd.PersianDate = '1405/05/15'

      Month name → number (used to build the 'YYYY/MM/%' prefix):
      فروردین=1، اردیبهشت=2، خرداد=3، تیر=4، مرداد=5، شهریور=6، مهر=7، آبان=8، آذر=9، دی=10، بهمن=11، اسفند=12

      Example (trades in تالار سیمان, مرداد 1405):
      SELECT TOP 100 cc.ID, cc.TotalPrice
      FROM [Auction_Fact].[CustomerContract] cc
      INNER JOIN [General_Dim].[Date] gd ON cc.Date_ID = gd.ID
      INNER JOIN [Auction_Dim].[Ring] r ON cc.Ring_ID = r.ID
      WHERE r.Name = N'تالار سیمان'
        AND gd.PersianDate LIKE '1405/05/%'

      Alternative integer columns (for GROUP BY / display, or exact filters):
      - d.PersianYear (1405), d.PersianMonth (1-12), d.PersianMonthName (N'مرداد')
      - d.PersianDayOfMonth (1-31), d.PersianDayOfWeek (1-7, 1=شنبه ... 7=جمعه — filter by the integer, NOT by name)
      - d.PersianWeekOfYear (1-53), d.PersianWeekRange ('YYYY/MM/DD - YYYY/MM/DD')
      - d.PersianSeason (1=بهار, 2=تابستان, 3=پاییز, 4=زمستان) / d.PersianSeasonName
      - Gregorian (میلادی) date column is d.RealDate — there is NO column named GregorianDate

      Rules:
      - The Persian year starts from month 1 (فروردین). If no year is given, use the most recent year present in the data.
  ring:
    rule_text: |
      تالار = Ring
      رینگ = Ring
      Always filter Ring by the FULL name stored in Auction_Dim.Ring.Name.
      Partial names map to the exact full name:
      پتروشیمی = تالار پتروشیمی و فرآورده های نفتی
      فلزات / بورس فلزات = تالار بورس فلزات قدیم
      صنعتی یا معدنی = تالار صنعتی و معدنی
      کشاورزی = تالار کشاورزی
      کشاورزی مشهد = تالار کشاورزی مشهد
      نفتی / فرآورده های نفتی = تالار فرآورده های نفتی
      صادراتی / کالای صادراتی = تالار کالای صادراتی
      کیش = تالار کالای صادراتی کيش
      فرعی = تالار فرعی
      فرعی صادراتی = تالار فرعی صادراتی
      خرد / معاملات خرد = تالار معاملات خرد
      مناقصه = تالار مناقصه
      مناقصه یکجا = تالار مناقصه یکجا
      حراج باز = تالار حراج باز
      حراج همزمان = تالار حراج همزمان
      Example: WHERE r.Name = N'تالار پتروشیمی و فرآورده های نفتی'
  currency:
    rule_text: |
      ارز = Currency
      Currency name comes from Currency.PersianName
  bank:
    rule_text: |
      بانک = Bank
      شعبه بانک = Bank
  carrier:
    rule_text: |
      حمل کننده = Carrier
      باربری = Carrier
  delivery:
    rule_text: |
      محل تحویل = DeliveryPlace
      انبار = DeliveryPlace
  payment:
    rule_text: |
      شرایط پرداخت = PaymentDelivery
      شرایط تحویل = PaymentDelivery
  topn:
    rule_text: |
      Top customers:
      ORDER BY SUM(CustomerContract.TotalPrice) DESC

      Top suppliers:
      ORDER BY SUM(Offer.HallContractTotalPrice) DESC

      Top commodities:
      ORDER BY SUM(CustomerContract.TotalPrice) DESC
