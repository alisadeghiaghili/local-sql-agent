{% extends "base.html" %}
{% block title %}{{ _("Login · Local SQL Agent") }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>{{ _("Welcome") }}</h1>
    <p class="muted">{{ _("Sign in to ask your database a question in Persian or English.") }}</p>
    <form method="post" action="{{ url_for('login') }}">
      <!-- Not enforced on this specific form (see webapp/app.py's
           _CSRF_EXEMPT_ENDPOINTS comment: no session exists yet to bind a
           token to before a first successful login), kept for the field's
           own sake -- a template a future change starts enforcing against
           should not also need a field added to it then. -->
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">{{ _("Username") }}</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>

      <label for="password">{{ _("Password") }}</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="btn btn-primary btn-block" type="submit">{{ _("Sign in") }}</button>
    </form>
  </div>
</div>
{% endblock %}
