# datasources.example.yaml — TEMPLATE (copy to project_config/datasources.yaml
# and fill in real source names; do NOT rename this file to datasources.yaml
# inside project_config.example/ itself — CI runs against
# PROJECT_CONFIG_DIR=project_config.example and must stay single-source)
#
# Optional file. When project_config/datasources.yaml does not exist, this
# deployment has exactly one warehouse connection, named "default", using
# DB_CONNECTION_URL -- the single-source behaviour every earlier release
# had, unchanged. Add this file once a deployment wants its connection
# described here instead of in one long URL in .env, or needs to query
# more than one database.
#
# This file DESCRIBES the connection (host, port, database, driver, ODBC
# options). .env holds only the secret: the RAW password, exactly as the
# database knows it, with no URL encoding of any kind. The code builds the
# SQLAlchemy URL and escapes every special character itself, so a password
# such as  p@ss/w:rd#1  is written to .env exactly like that.
#
# See docs/design/DATASOURCES.md for the decision record and the roadmap
# for what is deliberately not supported yet (combining data from different
# servers in one answer, mixing database types).
#
# default:
#   Which source a schema.yaml table belongs to when it sets no
#   `datasource:` key of its own. Required once more than one source is
#   listed below; inferred automatically when there is exactly one.
#
# datasources:
#   Source name -> definition. Each key is the name a schema.yaml table's
#   `datasource:` field refers to, and the name shown in /health, the audit
#   trail and error messages -- keep it short and stable.
#
#   A source is EITHER structured (host + database) OR legacy (url_env);
#   setting both is refused at start-up, naming the source.
#
#   Structured fields:
#     host                : (required) server name or address. For a named
#                           instance write host\INSTANCE and leave port out.
#     database            : (required) database name.
#     port                : (optional) default 1433.
#     driver              : (optional) ODBC driver, default
#                           "ODBC Driver 18 for SQL Server".
#     username            : the login as a plain value (it is not secret) ...
#     username_env        : ... or the NAME of an environment variable that
#                           holds it. Set one of the two, not both.
#     password_env        : the NAME of the environment variable that holds
#                           the RAW password. Required with a username.
#     trusted_connection  : true = Windows authentication. No login is sent,
#                           so username, username_env and password_env must
#                           not be set.
#     options             : (optional) extra ODBC keywords, e.g.
#                           TrustServerCertificate. A YAML true/false becomes
#                           "yes"/"no" and a number becomes its text.
#                           Credential keys (pwd, password, uid, user,
#                           user id), driver, trusted_connection, server,
#                           database and odbc_connect are refused: they have
#                           their own fields, or must never be written here.
#                           APP is accepted: it is the ODBC keyword that sets
#                           the session's program_name, so a DBA can pick this
#                           application's sessions out of
#                           sys.dm_exec_sessions. Every connection already
#                           carries APP=<DB_APPLICATION_NAME> (default
#                           local-sql-agent) unless the URL sets one; write it
#                           here only to use a different name for one source
#                           (application_name, below, does the same).
#
#   Legacy field (kept for deployments written against 6.1 and 6.2):
#     url_env             : the NAME of an environment variable holding a
#                           complete SQLAlchemy URL. That URL is used as
#                           written, so a password inside it still has to be
#                           percent-encoded by hand (@ becomes %40).
#
#   Fields for either form:
#     description         : (optional) free text shown to operators.
#     dialect             : (optional) must equal this deployment's
#                           SQL_DIALECT if set at all -- mixed dialects
#                           across sources are not supported yet. Leave it
#                           out; it exists so a file written today does not
#                           need editing once that lands.
#     application_name    : (optional) overrides DB_APPLICATION_NAME for just
#                           this source's connections, so a DBA can tell
#                           which source's sessions are which.
#     nolock              : (optional, true/false, default false) true makes
#                           every query on this source read its tables
#                           WITH (NOLOCK): the executor inserts the hint after
#                           each table reference (and its alias) just before
#                           the statement is sent. It means DIRTY READS --
#                           rows another transaction has not committed, and
#                           occasionally a row twice or not at all -- so turn
#                           it on only where the DBA requires it. Works in
#                           both forms. Table hints are T-SQL, so start-up is
#                           refused when a source sets it and SQL_DIALECT is
#                           not tsql. Derived tables, CTE names, table
#                           functions, #temp tables, @table variables,
#                           INFORMATION_SCHEMA and sys objects, and tables that
#                           already carry a WITH (...) hint are left as
#                           written. The audit trail keeps the validated SQL
#                           (without hints); only the text sent to the server
#                           changes.
#
# Two databases on the SAME server are a supported configuration as two
# sources, as below: each has its own connection pool, and each query runs
# on exactly one of them. If a question has to JOIN tables from both
# databases, use one source instead and give the second database's tables a
# multi-part db_schema in schema.yaml (e.g. `db_schema: "InventoryDW.dbo"`),
# which renders the three-part [InventoryDW].[dbo].[Table] reference SQL
# Server expects.
#
# Every source is validated at start-up: each environment variable named
# here must be set and non-empty (the message names the source and the
# variable, never the value), no part may be a leftover placeholder, and
# the connection's backend must match SQL_DIALECT.

default: sales

datasources:
  sales:
    description: Sales warehouse
    host: 10.0.0.5
    # port: 1433
    database: SalesDW
    # driver: ODBC Driver 18 for SQL Server
    username: nlq_reader
    password_env: DB_PASSWORD_SALES       # .env: DB_PASSWORD_SALES=<raw password>
    options:
      TrustServerCertificate: true        # rendered as TrustServerCertificate=yes
      # APP: local-sql-agent              # program_name in sys.dm_exec_sessions
    # nolock: true                        # read every table WITH (NOLOCK): dirty reads

  # A second database on the same server: its own source, its own pool.
  inventory:
    description: Inventory warehouse
    host: 10.0.0.5
    database: InventoryDW
    username: nlq_reader
    password_env: DB_PASSWORD_INVENTORY
    options:
      TrustServerCertificate: true

  # Windows authentication instead of a login and password:
  # reports:
  #   host: 10.0.0.6
  #   database: ReportsDW
  #   trusted_connection: true

  # The login's name from the environment as well:
  # finance:
  #   host: 10.0.0.7
  #   database: FinanceDW
  #   username_env: DB_USER_FINANCE
  #   password_env: DB_PASSWORD_FINANCE

  # Legacy form -- the NAME of a variable holding a complete SQLAlchemy URL.
  # Still supported, unchanged; prefer the structured form above.
  # warehouse2:
  #   url_env: DB_URL_WAREHOUSE2          # .env: DB_URL_WAREHOUSE2=mssql+pyodbc://...
  #   description: Written against 6.1/6.2
